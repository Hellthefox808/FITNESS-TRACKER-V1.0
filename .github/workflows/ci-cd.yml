name: Fitness Tracker CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Train & Serialize Baseline ML Model
        run: |
          python scripts/train_model.py

      - name: Execute Automated Test Suites
        run: |
          python -m unittest tests/unit/test_inference.py tests/integration/test_api.py tests/ml_validation/test_ml_validation.py

  docker-build:
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t fitai-backend:latest -f docker/Dockerfile.backend .
